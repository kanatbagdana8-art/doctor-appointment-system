<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жүйеге кіру | MedBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">MedBook</a>

    <nav>
        <a href="index.html">Басты бет</a>
        <a href="doctors.html">Дәрігерлер</a>
        <a href="register.html">Тіркелу</a>
    </nav>
</header>

<main class="auth-container">
    <section class="form-card">
        <h1>Жүйеге кіру</h1>
        <p>Аккаунтыңызға кіру үшін мәліметтерді енгізіңіз.</p>

        <form action="#" method="post">
            <label for="email">Электрондық пошта</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <label for="password">Құпиясөз</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Құпиясөзіңізді енгізіңіз"
                required
            >

            <button type="submit" class="btn btn-full">
                Кіру
            </button>
        </form>

        <p class="form-footer">
            Аккаунтыңыз жоқ па?
            <a href="register.html">Тіркелу</a>
        </p>
    </section>
</main>

<footer class="footer">
    <p>© 2026 MedBook. Барлық құқықтар қорғалған.</p>
</footer>

</body>
</html>
