<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу | MedBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">MedBook</a>

    <nav>
        <a href="index.html">Басты бет</a>
        <a href="doctors.html">Дәрігерлер</a>
        <a href="login.html">Кіру</a>
    </nav>
</header>

<main class="auth-container">
    <section class="form-card">
        <h1>Тіркелу</h1>
        <p>MedBook жүйесіне жаңа аккаунт жасаңыз.</p>

        <form action="#" method="post">
            <label for="fullname">Аты-жөніңіз</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Аты-жөніңізді енгізіңіз"
                required
            >

            <label for="email">Электрондық пошта</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <label for="phone">Телефон нөмірі</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="+7 700 000 00 00"
                required
            >

            <label for="password">Құпиясөз</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Құпиясөз жасаңыз"
                required
            >

            <button type="submit" class="btn btn-full">
                Тіркелу
            </button>
        </form>

        <p class="form-footer">
            Аккаунтыңыз бар ма?
            <a href="login.html">Жүйеге кіру</a>
        </p>
    </section>
</main>

<footer class="footer">
    <p>© 2026 MedBook. Барлық құқықтар қорғалған.</p>
</footer>

</body>
</html>
